name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check for Docker Hub credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Docker build — DOCKERHUB_USERNAME secret not configured"
          fi

      - name: Prepare platform tag-safe name
        if: steps.creds.outputs.has_creds == 'true'
        run: echo "PLATFORM_PAIR=$(echo ${{ matrix.platform }} | sed 's|/|-|g')" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        if: steps.creds.outputs.has_creds == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.has_creds == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.has_creds == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker repo name
        if: steps.creds.outputs.has_creds == 'true'
        run: echo "DOCKER_REPO=${{ vars.DOCKER_REPO || 'mauriceboe/trek' }}" >> $GITHUB_ENV

      - name: Build and push by digest
        if: steps.creds.outputs.has_creds == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true

      - name: Export digest
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check for Docker Hub credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Docker merge — DOCKERHUB_USERNAME secret not configured"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.has_creds == 'true'

      - name: Get version from package.json
        if: steps.creds.outputs.has_creds == 'true'
        id: version
        run: echo "VERSION=$(node -p "require('./server/package.json').version")" >> $GITHUB_OUTPUT

      - name: Download build digests
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.has_creds == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.has_creds == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker repo names
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          echo "DOCKER_REPO=${{ vars.DOCKER_REPO || 'mauriceboe/trek' }}" >> $GITHUB_ENV
          echo "DOCKER_REPO_LEGACY=${{ vars.DOCKER_REPO_LEGACY || 'mauriceboe/nomad' }}" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest
        if: steps.creds.outputs.has_creds == 'true'
        working-directory: /tmp/digests
        run: |
          mapfile -t digests < <(printf '${{ env.DOCKER_REPO }}@sha256:%s\n' *)
          tags=(-t "${{ env.DOCKER_REPO }}:latest" -t "${{ env.DOCKER_REPO }}:${{ steps.version.outputs.VERSION }}")
          if [ -n "${{ env.DOCKER_REPO_LEGACY }}" ]; then
            tags+=(-t "${{ env.DOCKER_REPO_LEGACY }}:latest" -t "${{ env.DOCKER_REPO_LEGACY }}:${{ steps.version.outputs.VERSION }}")
          fi
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

      - name: Inspect manifest
        if: steps.creds.outputs.has_creds == 'true'
        run: docker buildx imagetools inspect ${{ env.DOCKER_REPO }}:latest
